{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Email | Sri Annai Precast</title>

    <link
        rel="stylesheet"
        href="{% static 'auth.css' %}"
    >

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="brand">

                <h1>Sri Annai Precast</h1>

                <p>
                    SFRC Manhole Cover Solutions
                </p>

            </div>


            <div class="auth-heading">

                <h2>Verify Your Email</h2>

                <p>
                    Enter the OTP sent to your email
                </p>

            </div>


            {% if messages %}

                {% for message in messages %}

                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="otp">
                        Email OTP
                    </label>

                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        placeholder="Enter 6-digit OTP"
                        maxlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Verify Email
                </button>

            </form>


            <div class="auth-footer">

                <a href="{% url 'resend_otp' %}">
                    Resend OTP
                </a>

                <a href="{% url 'register' %}">
                    Back to Registration
                </a>

            </div>

        </div>

    </div>

</body>

</html>
