{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Sri Annai Precast</title>

    <link
        rel="stylesheet"
        href="{% static 'auth.css' %}"
    >

</head>


<body>

    <div class="auth-container">

        <a class="home-link" href="{% url 'home' %}">Home</a>

        <div class="auth-card">

            <div class="brand">

                <h1>Sri Annai Precast</h1>

                <p>
                    SFRC Manhole Cover Solutions
                </p>

            </div>


            <div class="auth-heading">

                <h2>Welcome Back</h2>

                <p>
                    Login to your account
                </p>

            </div>


            {% if messages %}

                {% for message in messages %}

                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                </p>

                <a href="{% url 'register' %}">
                    Create Account
                </a>

            </div>

        </div>

    </div>

</body>

</html>
